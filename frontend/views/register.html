<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="h3 text-center mb-4">Create your BorrowD account</h2>
          <form>
            <div class="mb-3">
              <label for="register-first-name" class="form-label">First name</label>
              <input type="text" class="form-control" id="register-first-name" name="firstName" required>
              <div class="invalid-feedback">Please enter your first name.</div>
            </div>
            <div class="mb-3">
              <label for="register-last-name" class="form-label">Last name</label>
              <input type="text" class="form-control" id="register-last-name" name="lastName" required>
              <div class="invalid-feedback">Please enter your last name.</div>
            </div>
            <div class="mb-3">
              <label for="register-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="register-email" name="email" required>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            <div class="mb-3">
              <label for="register-password" class="form-label">Password</label>
              <input type="password" class="form-control" id="register-password" name="password" required>
              <div class="invalid-feedback">Please enter a password.</div>
            </div>
            <div class="mb-4">
              <label for="register-confirm-password" class="form-label">Confirm password</label>
              <input type="password" class="form-control" id="register-confirm-password" name="confirmPassword"
                required>
              <div class="invalid-feedback">Please confirm your password.</div>
            </div>
            <button type="button" class="btn btn-primary w-100">Register</button>
          </form>
          <p class="text-center mb-0 mt-4">
            Already have an account? <a href="#login">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
